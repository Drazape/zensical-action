name: Documentation

on:
  workflow_call:
    inputs:
      config-file:
        description: Path to the Zensical configuration file, relative to the repository root.
        required: false
        type: string
        default: docs/zensical.toml
      site-dir:
        description: Path to the generated site directory, relative to the repository root.
        required: false
        type: string
        default: docs/site
      python-version:
        description: Python version used to install Zensical.
        required: false
        type: string
        default: "3.x"
      wordlist-path:
        description: Path to the spell-check wordlist, relative to the repository root.
        required: false
        type: string
        default: docs/spellcheck/wordlist.txt

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Check for unused wordlist entries
        env:
          WORDLIST_PATH: ${{ inputs.wordlist-path }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          wordlist_path = Path(os.environ["WORDLIST_PATH"])

          if not wordlist_path.is_file():
              print(f"::error::Wordlist not found: {wordlist_path}")
              sys.exit(1)

          entries = []
          for line_number, line in enumerate(
              wordlist_path.read_text(encoding="utf-8-sig").splitlines(), start=1
          ):
              word = line.strip()
              if not word or word.startswith("#"):
                  continue
              entries.append((line_number, word))

          # Only inspect tracked files so generated documentation is ignored.
          try:
              markdown_files = subprocess.check_output(
                  ["git", "ls-files", "-z", "--", "*.md"],
                  encoding="utf-8",
              ).split("\0")
          except subprocess.CalledProcessError:
              print("::error::Could not list Markdown files with git.")
              sys.exit(1)

          markdown_text = "\n".join(
              Path(path).read_text(encoding="utf-8", errors="replace")
              for path in markdown_files
              if path
          )

          unused = []
          for line_number, word in entries:
              pattern = re.compile(
                  r"(?<!\w)" + re.escape(word) + r"(?!\w)",
                  re.IGNORECASE,
              )
              if not pattern.search(markdown_text):
                  unused.append((line_number, word))

          if not unused:
              print(f"All {len(entries)} wordlist entries are used.")
              sys.exit(0)

          print(f"Unused wordlist entries in {wordlist_path}:")
          for line_number, word in unused:
              print(f"{wordlist_path}:{line_number}: {word}")
              print(
                  f"::error file={wordlist_path},line={line_number},"
                  f"title=Unused wordlist entry::{word}"
              )

          sys.exit(1)
          PY

      - uses: rojopolis/spellcheck-github-actions@v0
        with:
          output_file: spellcheck-output.txt
          task_name: Markdown
          config_path: docs/spellcheck/config.yaml
      - uses: actions/upload-artifact@v7
        if: '!cancelled()'
        with:
          path: spellcheck-output.txt
          archive: false

      - uses: actions/configure-pages@v6
      - run: pip install zensical
      - run: zensical build --strict --clean --config-file="${{ inputs.config-file }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.site-dir }}

  deploy:
    name: Deploy Documentation
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
