name: Documentation

on:
  workflow_call:
    inputs:
      config-file:
        description: Path to the Zensical configuration file, relative to the repository root.
        required: false
        type: string
        default: docs/zensical.toml
      site-dir:
        description: Path to the generated site directory, relative to the repository root.
        required: false
        type: string
        default: docs/site
      python-version:
        description: Python version used to install Zensical.
        required: false
        type: string
        default: "3.x"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: rojopolis/spellcheck-github-actions@v0
        with:
          output_file: spellcheck-output.txt
          task_name: Markdown
          config_path: docs/spellcheck/config.yaml
      - uses: actions/upload-artifact@v7
        if: '!cancelled()'
        with:
          path: spellcheck-output.txt
          archive: false

      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install zensical
      - run: zensical build --strict --clean --config-file="${{ inputs.config-file }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.site-dir }}

  deploy:
    name: Deploy Documentation
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
